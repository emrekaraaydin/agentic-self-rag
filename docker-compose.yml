# Local Qdrant vector database container with HTTP and gRPC APIs
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_rag
    restart: always
    ports:
      - "6333:6333" # HTTP API and Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: